[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanguard-ai"
version = "3.0.0"
description = "OceanGuard AI Submarine Cable Protection API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "pydantic",
    "httpx",
    "requests",
]

[tool.fastapi]
entrypoint = "backend.main:app"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["frontend*"]